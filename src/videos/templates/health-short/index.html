<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sức Khoẻ 360 Video</title>
  <!-- Google Fonts: Montserrat for bold impact, Fredoka for friendly rounded looks, Outfit for clean look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <!-- GSAP for frame-accurate rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    :root {
      --primary: #10B981; /* Emerald green */
      --secondary: #34D399;
      --accent: #FBBF24; /* Amber yellow for highlight */
      --bg-dark: #000000;
      --text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Ambient background gradient shown during load or transition gaps */
    .bg-mesh {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #064e3b 0%, #022c22 50%, #000000 100%);
      z-index: 1;
      filter: blur(10px);
    }

    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 2;
    }

    /* Fullscreen Dynamic Media Viewport */
    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-color: #000000;
      z-index: 5;
      overflow: hidden;
    }

    .media-container img, .media-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.05);
    }

    /* Elegant spinning watermark circular text logo in top-left */
    .watermark-container {
      position: absolute;
      top: 100px;
      left: 80px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 40;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.1);
      padding: 14px 28px;
      border-radius: 50px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .watermark-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      animation: watermark-pulse 2s infinite alternate ease-in-out;
    }

    .watermark-text {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes watermark-pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    /* Centered High-Contrast Karaok Subtitles Overlay */
    .caption-container {
      position: absolute;
      bottom: 480px;
      left: 60px;
      width: 960px;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 18px 24px;
      z-index: 30;
      pointer-events: none;
    }

    /* Styled individual words with maximum contrast shadow outline */
    .word {
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 74px;
      font-weight: 900;
      line-height: 1.35;
      text-transform: uppercase;
      display: inline-block;
      transition: color 0.08s ease, transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 
        -4px -4px 0 #000,  
         4px -4px 0 #000,
        -4px  4px 0 #000,
         4px  4px 0 #000,
        -6px  0px 0 #000,
         6px  0px 0 #000,
         0px -6px 0 #000,
         0px  6px 0 #000,
         0 10px 20px rgba(0, 0, 0, 0.85);
    }

    /* Active highlighted word */
    .word.active {
      color: var(--accent);
      transform: scale(1.18);
      text-shadow: 
        -4px -4px 0 #000,  
         4px -4px 0 #000,
        -4px  4px 0 #000,
         4px  4px 0 #000,
        -6px  0px 0 #000,
         6px  0px 0 #000,
         0px -6px 0 #000,
         0px  6px 0 #000,
         0 0 35px rgba(251, 191, 36, 0.8),
         0 12px 24px rgba(0, 0, 0, 0.9);
    }

    /* Premium Progress Bar at bottom */
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 45;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 0 25px var(--primary);
    }
  </style>
</head>
<body data-composition-id="health-short" data-width="1080" data-height="1920" data-duration="10">

  <!-- Background visual structure -->
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <!-- Fullscreen Dynamic Media Viewport -->
  <div class="media-container" id="media-box"></div>

  <!-- Elegant Logo Watermark -->
  <div class="watermark-container">
    <div class="watermark-logo">🌿</div>
    <div class="watermark-text">@suckhoe360</div>
  </div>

  <!-- Subtitles directly overlaying the full-screen background -->
  <div class="caption-container" id="caption-box">
    <!-- Words will be injected here dynamically -->
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-indicator"></div>
  </div>

  <!-- Audios will be added dynamically by the server -->

  <script>
    // Replaced dynamically by NestJS VideosService
    window.__wordsData = [
      /* INJECT_WORDS_DATA */
    ];
    window.__scenesData = [
      /* INJECT_SCENES_DATA */
    ];
    window.__videoDuration = 10; // Default fallback, replaced by server

    const captionBox = document.getElementById('caption-box');
    const mediaBox = document.getElementById('media-box');

    // Highly reliable, ultra-fast CDNs for fallback images (1080x1920)
    const fallbacks = [
      "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=1080&auto=format&fit=crop", // yoga / fitness
      "https://images.unsplash.com/photo-1511295742364-92767fa62d9f?q=80&w=1080&auto=format&fit=crop", // sleep / bed
      "https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1080&auto=format&fit=crop", // salad / diet
      "https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=1080&auto=format&fit=crop", // zen / meditation
      "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?q=80&w=1080&auto=format&fit=crop", // water glass
      "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?q=80&w=1080&auto=format&fit=crop", // running / exercise
      "https://images.unsplash.com/photo-1501854140801-50d01698950b?q=80&w=1080&auto=format&fit=crop"  // nature / breathing
    ];

    function createMediaElement(url, idAttr) {
      const isVideo = url.toLowerCase().endsWith('.mp4') || url.includes('/video/') || url.includes('mixkit.co');
      if (isVideo) {
        const video = document.createElement('video');
        video.src = url;
        video.id = idAttr;
        video.preload = "auto";
        video.muted = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('crossorigin', 'anonymous');
        return video;
      } else {
        const img = document.createElement('img');
        img.src = url;
        img.id = idAttr;
        img.setAttribute('crossorigin', 'anonymous');
        return img;
      }
    }

    // Populate media into the single fullscreen box
    if (window.__scenesData && window.__scenesData.length > 0) {
      window.__scenesData.forEach((scene, sIdx) => {
        const mediaUrl = scene.imageUrl || fallbacks[sIdx % fallbacks.length];
        const el = createMediaElement(mediaUrl, `media-el-${sIdx}`);
        mediaBox.appendChild(el);
      });
    }

    // 1. Render all words in the container
    if (window.__wordsData && window.__wordsData.length > 0) {
      window.__wordsData.forEach((w, idx) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.id = `word-${idx}`;
        span.textContent = w.text;
        captionBox.appendChild(span);
      });
    } else {
      captionBox.innerHTML = '<span class="word active" style="font-family:\'Montserrat\',sans-serif">Bí quyết sống khỏe...</span>';
    }

    // 2. Build GSAP timeline for deterministic, frame-accurate animation
    const mainTimeline = gsap.timeline();

    // Word highlighting timeline
    if (window.__wordsData && window.__wordsData.length > 0) {
      window.__wordsData.forEach((w, idx) => {
        const elementId = `#word-${idx}`;
        const duration = w.end - w.start;

        mainTimeline.to(elementId, {
          className: 'word active',
          duration: 0.04,
        }, w.start);

        mainTimeline.to(elementId, {
          className: 'word',
          duration: 0.04,
        }, w.end);
      });
    }

    // Scene Transition animations (fully dynamic full-screen Ken Burns & transitions)
    if (window.__scenesData && window.__scenesData.length > 0) {
      window.__scenesData.forEach((scene, sIdx) => {
        const el = document.getElementById(`media-el-${sIdx}`);
        if (!el) return;

        // Set initial state
        gsap.set(el, { opacity: 0, scale: 1.05 });

        // Fade + zoom in active scene media
        mainTimeline.to(el, {
          opacity: 1,
          scale: 1.08,
          duration: 0.5,
          ease: 'power2.out'
        }, scene.start);

        // Ken Burns effect: continuous subtle scale and panning over scene duration
        const sceneDur = scene.end - scene.start;
        mainTimeline.to(el, {
          scale: 1.18,
          x: sIdx % 2 === 0 ? '-2%' : '2%',
          y: '-1%',
          duration: sceneDur,
          ease: 'none'
        }, scene.start);

        // Frame-accurate video playhead sync inside the GSAP master timeline
        if (el.tagName === 'VIDEO') {
          mainTimeline.fromTo(el, {
            currentTime: 0
          }, {
            currentTime: Math.min(sceneDur, 30),
            ease: 'none',
            duration: sceneDur
          }, scene.start);
        }

        // Fade out at end of scene (unless it's the last one)
        if (sIdx < window.__scenesData.length - 1) {
          mainTimeline.to(el, {
            opacity: 0,
            scale: 0.98,
            duration: 0.5,
            ease: 'power2.in'
          }, scene.end - 0.2); // slight crossfade overlap
        }
      });
    }

    // Progress Bar Animation across the entire duration
    mainTimeline.to('#progress-indicator', {
      width: '100%',
      ease: 'none',
      duration: window.__videoDuration
    }, 0);

    // Register timelines with HyperFrames
    window.__timelines = {
      "health-short": mainTimeline
    };
  </script>
</body>
</html>
