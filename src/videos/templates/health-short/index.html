<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sức Khoẻ 360 Video</title>
  <!-- Google Fonts: Inter and Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <!-- GSAP for frame-accurate rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    :root {
      --primary: #10B981; /* Emerald green */
      --secondary: #34D399;
      --accent: #FBBF24; /* Amber yellow for highlight */
      --bg-dark: #0A0F0D;
      --text: #FFFFFF;
      --card-bg: rgba(16, 20, 18, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Ambient background gradient animation */
    .bg-mesh {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #064e3b 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, #022c22 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #111827 0%, transparent 60%);
      z-index: 1;
      filter: blur(10px);
    }

    /* Elegant grid lines for structure */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 2;
    }

    /* Header Container */
    .header {
      position: absolute;
      top: 150px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .logo-container {
      width: 120px;
      height: 120px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      margin-bottom: 25px;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
    }

    .logo-icon {
      font-size: 55px;
      color: var(--secondary);
    }

    .brand-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .brand-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 26px;
      color: var(--secondary);
      margin-top: 5px;
    }

    /* Glassmorphic Main Card */
    .card {
      position: absolute;
      top: 480px;
      left: 80px;
      width: 920px;
      height: 1000px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 10;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    /* Video Topic Badge */
    .badge {
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      padding: 10px 24px;
      border-radius: 20px;
      margin-bottom: 40px;
    }

    /* Captions/Subtitle Container */
    .caption-container {
      width: 100%;
      text-align: center;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.45;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 16px 20px;
    }

    /* Styled individual words */
    .word {
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.1s ease, transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Highlight class for current word */
    .word.active {
      color: var(--accent);
      transform: scale(1.18);
      text-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
    }

    /* Footer Branding */
    .footer {
      position: absolute;
      bottom: 120px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
      z-index: 10;
    }

    /* Premium Progress Bar at bottom */
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 15px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 10;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 0 20px var(--primary);
    }
  </style>
</head>
<body data-composition-id="health-short" data-width="1080" data-height="1920">

  <!-- Core background visuals -->
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <!-- Header Section -->
  <div class="header">
    <div class="logo-container">
      <div class="logo-icon">🌿</div>
    </div>
    <div class="brand-title">Sức Khoẻ 360</div>
    <div class="brand-subtitle">Bí Quyết Sống Khoẻ Mỗi Ngày</div>
  </div>

  <!-- Main Subtitle Card -->
  <div class="card">
    <div class="badge" id="video-tag">Mẹo Sức Khoẻ</div>
    <div class="caption-container" id="caption-box">
      <!-- Words will be injected here dynamically -->
    </div>
  </div>

  <!-- Footer Branding -->
  <div class="footer">@suckhoe360 · Bấm để xem thêm</div>

  <!-- Progress Bar -->
  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-indicator"></div>
  </div>

  <!-- Audios will be added dynamically by the server -->

  <script>
    // These values will be replaced dynamically by NestJS VideosService
    window.__wordsData = [
      /* INJECT_WORDS_DATA */
    ];
    window.__videoDuration = 10; // Default fallback, replaced by server

    const captionBox = document.getElementById('caption-box');

    // 1. Render all words in the container
    if (window.__wordsData && window.__wordsData.length > 0) {
      window.__wordsData.forEach((w, idx) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.id = `word-${idx}`;
        span.textContent = w.text;
        captionBox.appendChild(span);
      });
    } else {
      captionBox.innerHTML = '<span style="color: white; font-size: 40px;">Bí quyết sống khỏe...</span>';
    }

    // 2. Build GSAP timeline for deterministic, frame-accurate animation
    const mainTimeline = gsap.timeline();

    // Word highlighting timeline
    if (window.__wordsData && window.__wordsData.length > 0) {
      window.__wordsData.forEach((w, idx) => {
        const elementId = `#word-${idx}`;
        const duration = w.end - w.start;

        // Highlight at start time
        mainTimeline.to(elementId, {
          className: 'word active',
          duration: 0.05,
        }, w.start);

        // De-highlight at end time
        mainTimeline.to(elementId, {
          className: 'word',
          duration: 0.05,
        }, w.end);
      });
    }

    // Progress Bar Animation across the entire duration
    mainTimeline.to('#progress-indicator', {
      width: '100%',
      ease: 'none',
      duration: window.__videoDuration
    }, 0);

    // Register timelines with HyperFrames
    window.__timelines = {
      "health-short": mainTimeline
    };
  </script>
</body>
</html>
